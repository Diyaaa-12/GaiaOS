name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.lock
          python -m pip install -e sdk/python

      - name: Start PostgreSQL and Redis stack
        run: |
          # Use the local docker-compose setup to ensure exact parity with dev environment.
          # The override file exposes port 5432 and 6379 to the GitHub Actions runner (localhost).
          cp docker-compose.override.yml.example docker-compose.override.yml
          docker compose up -d --wait postgres redis
          until PGPASSWORD=gaiaos_dev_password psql -h 127.0.0.1 -U gaiaos -d gaiaos -c "SELECT 1" >/dev/null 2>&1; do
            sleep 1
          done

      - name: Run Ruff
        run: ruff check .

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://gaiaos:gaiaos_dev_password@127.0.0.1:5432/gaiaos
          REDIS_URL: redis://127.0.0.1:6379/0
        run: alembic upgrade head

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://gaiaos:gaiaos_dev_password@127.0.0.1:5432/gaiaos
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest

      - name: Verify OpenAPI specification drift
        run: |
          python scripts/generate_openapi_spec.py
          if ! git diff --exit-code docs/api/openapi/openapi.json; then
            echo "::error::OpenAPI specification is out of date. Run scripts/generate_openapi_spec.py and commit the updated docs/api/openapi/openapi.json."
            exit 1
          fi

      - name: Verify Python SDK drift & package build
        run: |
          python scripts/generate_sdk.py
          if ! git diff --exit-code sdk/python; then
            echo "::error::Python SDK is out of date with OpenAPI specification. Run python scripts/generate_sdk.py and commit updated sdk/python."
            exit 1
          fi
          python -m build sdk/python
          twine check sdk/python/dist/*

      - name: Verify documentation drift
        run: python scripts/verify_documentation_drift.py

      - name: Flush stale RQ jobs left over from the Pytest run
        run: |
          # tests/ enqueues real RQ jobs onto the shared Redis instance (127.0.0.1:6379)
          # used by "Run Pytest" above. Any jobs left un-consumed in the "default" queue
          # get dequeued by the worker container ahead of the smoke-test job below,
          # each burning ~10s on external API calls (geocoding/tide lookups) that are
          # slow/unreachable from GitHub Actions runners. That backlog previously pushed
          # the smoke job's completion past the smoke test's poll window. Flushing here
          # guarantees the worker starts with an empty queue.
          docker compose exec -T redis redis-cli FLUSHALL
        
      - name: Build and verify container images (app, worker, scheduler)
        run: |
          docker compose up -d --build --wait app worker scheduler
          curl --fail http://localhost:8000/api/v1/health/live
          python -m tests.test_worker_image_smoke

      - name: Dump container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs app
          docker compose logs worker
          docker compose logs scheduler



