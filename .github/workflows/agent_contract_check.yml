name: Agent Contract & Benchmark Coverage Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-agent-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Agent Contract & Benchmark Coverage Validator
        run: python -m eval.agent_contract_validator
