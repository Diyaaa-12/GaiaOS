name: Agent Contract & Benchmark Coverage Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-agent-contracts:
    name: Agent Contract & Benchmark Coverage Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.lock

      - name: Run Agent Contract & Benchmark Coverage Validator
        run: python -m eval.agent_contract_validator
