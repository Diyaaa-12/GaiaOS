name: k3s Helm & Multi-Node Deployment Smoke Verification

on:
  push:
    branches:
      - verification/phase8-m2-k3s-smoke
  schedule:
    - cron: "0 4 * * 0"   # Weekly on Sunday at 04:00 UTC
  workflow_dispatch:     # On-demand manual trigger

permissions:
  contents: read

jobs:
  k3s-helm-smoke:
    name: k3s Cluster & Helm Deployment Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/dev.lock

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest psycopg2-binary

      - name: Install Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install & Start k3s Cluster
        run: |
          curl -sfL https://get.k3s.io | K3S_KUBECONFIG_MODE="644" sh -
          mkdir -p ~/.kube
          cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get nodes

      - name: Lint Helm Chart
        run: |
          helm lint deploy/helm/gaiaos

      - name: Build local PostGIS database & Redis test images
        run: |
          docker build -t gaiaos/postgres-postgis:ci infra/docker/postgres
          docker pull redis:7-alpine

      - name: Build local GaiaOS application images
        run: |
          docker build -t gaiaos/app:ci -f Dockerfile .
          docker build -t gaiaos/worker:ci -f Dockerfile.worker .
          docker build -t gaiaos/scheduler:ci -f Dockerfile.worker .
          docker build -t gaiaos/admin-ui:ci -f admin_ui/Dockerfile.admin_ui admin_ui/

      - name: Import images into k3s image store
        run: |
          docker save gaiaos/postgres-postgis:ci redis:7-alpine gaiaos/app:ci gaiaos/worker:ci gaiaos/scheduler:ci gaiaos/admin-ui:ci | sudo k3s ctr images import -

      - name: Create PostGIS Init Extensions ConfigMap in k3s
        run: |
          kubectl create configmap postgres-init-sql --from-file=01-init-extensions.sql=infra/docker/postgres/init-extensions.sql

      - name: Deploy PostGIS & Redis test dependencies in k3s
        run: |
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                containers:
                  - name: postgres
                    image: gaiaos/postgres-postgis:ci
                    imagePullPolicy: Never
                    env:
                      - name: POSTGRES_USER
                        value: gaiaos
                      - name: POSTGRES_PASSWORD
                        value: gaiaos_dev_password
                      - name: POSTGRES_DB
                        value: gaiaos
                    ports:
                      - containerPort: 5432
                    volumeMounts:
                      - name: init-sql
                        mountPath: /docker-entrypoint-initdb.d/01-init-extensions.sql
                        subPath: 01-init-extensions.sql
                volumes:
                  - name: init-sql
                    configMap:
                      name: postgres-init-sql
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            ports:
              - port: 5432
            selector:
              app: postgres
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: redis
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: redis
            template:
              metadata:
                labels:
                  app: redis
              spec:
                containers:
                  - name: redis
                    image: redis:7-alpine
                    imagePullPolicy: Never
                    ports:
                      - containerPort: 6379
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: redis
          spec:
            ports:
              - port: 6379
            selector:
              app: redis
          EOF
          kubectl rollout status deployment/postgres --timeout=120s
          kubectl rollout status deployment/redis --timeout=60s

      - name: Verify PostGIS & Vector Extensions in Database Container
        run: |
          echo "Waiting for PostGIS extension initialization..."
          until kubectl exec deployment/postgres -- psql -U gaiaos -d gaiaos -c "SELECT PostGIS_Version();" >/dev/null 2>&1; do
            sleep 2
          done
          kubectl exec deployment/postgres -- psql -U gaiaos -d gaiaos -c "SELECT PostGIS_Version();"
          kubectl exec deployment/postgres -- psql -U gaiaos -d gaiaos -c "SELECT * FROM pg_extension WHERE extname = 'vector';"

      - name: Deploy GaiaOS Helm Release
        run: |
          helm install gaiaos deploy/helm/gaiaos \
            --set image.app.repository=gaiaos/app \
            --set image.app.tag=ci \
            --set image.app.pullPolicy=Never \
            --set image.worker.repository=gaiaos/worker \
            --set image.worker.tag=ci \
            --set image.worker.pullPolicy=Never \
            --set image.scheduler.repository=gaiaos/scheduler \
            --set image.scheduler.tag=ci \
            --set image.scheduler.pullPolicy=Never \
            --set image.adminUi.repository=gaiaos/admin-ui \
            --set image.adminUi.tag=ci \
            --set image.adminUi.pullPolicy=Never \
            --set externalDatabase.url="postgresql://gaiaos:gaiaos_dev_password@postgres.default.svc.cluster.local:5432/gaiaos" \
            --set externalRedis.url="redis://redis.default.svc.cluster.local:6379/0"

      - name: Wait for Pod Rollout
        run: |
          kubectl rollout status deployment/gaiaos-app --timeout=180s
          kubectl rollout status deployment/gaiaos-worker --timeout=180s
          kubectl rollout status deployment/gaiaos-scheduler --timeout=180s
          kubectl rollout status deployment/gaiaos-admin-ui --timeout=180s

      - name: Port-Forward FastAPI App & Execute Smoke Verification
        run: |
          kubectl port-forward svc/gaiaos-app 8000:8000 &
          PF_PID=$!
          sleep 5
          SMOKE_BASE_URL=http://localhost:8000 python -m tests.test_worker_image_smoke
          kill $PF_PID

      - name: Dump Kubernetes Pod Logs & Events on Failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A
          kubectl logs -l app.kubernetes.io/name=gaiaos --all-containers=true --tail=100
