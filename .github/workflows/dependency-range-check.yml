name: Dependency Range Drift Check

on:
  push:
    branches: ["main"]
    paths:
      - "requirements/**"
      - "scripts/check_requirements_drift.py"
      - ".github/workflows/dependency-range-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "requirements/**"
      - "scripts/check_requirements_drift.py"
      - ".github/workflows/dependency-range-check.yml"

permissions:
  contents: read

jobs:
  check-dependency-drift:
    name: Dependency Range Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install packaging

      - name: Check base requirements range drift
        run: python scripts/check_requirements_drift.py requirements/base.txt requirements/base.lock

      - name: Check dev requirements range drift
        run: python scripts/check_requirements_drift.py requirements/dev.txt requirements/dev.lock
