apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gaiaos.fullname" . }}-scheduler
  labels:
    app.kubernetes.io/name: {{ include "gaiaos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.replicaCount.scheduler }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gaiaos.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gaiaos.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          image: "{{ .Values.image.scheduler.repository }}:{{ .Values.image.scheduler.tag }}"
          imagePullPolicy: {{ .Values.image.scheduler.pullPolicy }}
          command:
            - python
            - -m
            - workers.scheduler
          envFrom:
            - configMapRef:
                name: {{ include "gaiaos.fullname" . }}-config
            - secretRef:
                name: {{ default (printf "%s-secrets" (include "gaiaos.fullname" .)) .Values.existingSecret }}
          resources:
            limits:
              cpu: {{ .Values.resources.scheduler.limits.cpu | quote }}
              memory: {{ .Values.resources.scheduler.limits.memory | quote }}
            requests:
              cpu: {{ .Values.resources.scheduler.requests.cpu | quote }}
              memory: {{ .Values.resources.scheduler.requests.memory | quote }}
