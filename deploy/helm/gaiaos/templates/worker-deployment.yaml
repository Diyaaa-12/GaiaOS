apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gaiaos.fullname" . }}-worker
  labels:
    app.kubernetes.io/name: {{ include "gaiaos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gaiaos.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gaiaos.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "gaiaos.fullname" . }}-config
            - secretRef:
                name: {{ default (printf "%s-secrets" (include "gaiaos.fullname" .)) .Values.existingSecret }}
          resources:
            limits:
              cpu: {{ .Values.resources.worker.limits.cpu | quote }}
              memory: {{ .Values.resources.worker.limits.memory | quote }}
            requests:
              cpu: {{ .Values.resources.worker.requests.cpu | quote }}
              memory: {{ .Values.resources.worker.requests.memory | quote }}
