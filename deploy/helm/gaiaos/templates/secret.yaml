{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gaiaos.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: {{ include "gaiaos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  REDIS_URL: {{ .Values.externalRedis.url | quote }}
  JWT_SECRET_KEY: {{ .Values.auth.jwtSecretKey | quote }}
{{- end }}
