apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gaiaos.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "gaiaos.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  GAIAOS_ENV: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  WORKER_POOL_SIZE: {{ .Values.workerConfig.poolSize | quote }}
  WORKER_CONCURRENCY_PER_PROCESS: {{ .Values.workerConfig.concurrencyPerProcess | quote }}
  ENABLE_AUTH: {{ .Values.auth.enableAuth | quote }}
  ENABLE_RATE_LIMITING: {{ .Values.auth.enableRateLimiting | quote }}
