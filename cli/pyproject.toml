[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "gaiaos-cli"
version = "0.7.0"
description = "Official CLI Wizard for GaiaOS — Agentic Planetary Risk Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "GaiaOS Core Engineering Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "gaiaos-sdk>=0.7.0",
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.scripts]
gaiaos = "gaiaos_cli.main:app"

[project.urls]
Homepage = "https://github.com/Diyaaa-12/GaiaOS"
Repository = "https://github.com/Diyaaa-12/GaiaOS"

[tool.hatch.build.targets.wheel]
packages = ["gaiaos_cli"]

[tool.hatch.build.targets.wheel.package-data]
gaiaos_cli = ["py.typed"]
