name: gaiaos

services:
  postgres:
    build:
      context: ./infra/docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: gaiaos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gaiaos_dev_password}
      POSTGRES_DB: gaiaos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaiaos -d gaiaos"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      GAIAOS_ENV: ${GAIAOS_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql://gaiaos:${POSTGRES_PASSWORD:-gaiaos_dev_password}@postgres:5432/gaiaos
      REDIS_URL: redis://redis:6379/0
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-2}
      WORKER_CONCURRENCY_PER_PROCESS: ${WORKER_CONCURRENCY_PER_PROCESS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${APP_CPU_LIMIT:-1.0}'
          memory: '${APP_MEMORY_LIMIT:-512M}'
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://localhost:8000/api/v1/health/live'); sys.exit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      GAIAOS_ENV: ${GAIAOS_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql://gaiaos:${POSTGRES_PASSWORD:-gaiaos_dev_password}@postgres:5432/gaiaos
      REDIS_URL: redis://redis:6379/0
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-2}
      WORKER_CONCURRENCY_PER_PROCESS: ${WORKER_CONCURRENCY_PER_PROCESS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPU_LIMIT:-1.0}'
          memory: '${WORKER_MEMORY_LIMIT:-512M}'

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m workers.scheduler
    environment:
      GAIAOS_ENV: ${GAIAOS_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql://gaiaos:${POSTGRES_PASSWORD:-gaiaos_dev_password}@postgres:5432/gaiaos
      REDIS_URL: redis://redis:6379/0
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-2}
      WORKER_CONCURRENCY_PER_PROCESS: ${WORKER_CONCURRENCY_PER_PROCESS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${SCHEDULER_CPU_LIMIT:-0.5}'
          memory: '${SCHEDULER_MEMORY_LIMIT:-256M}'

  admin_ui:
    build:
      context: ./admin_ui
      dockerfile: Dockerfile.admin_ui
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${ADMIN_UI_CPU_LIMIT:-0.25}'
          memory: '${ADMIN_UI_MEMORY_LIMIT:-128M}'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    volumes:
      - minio_data:/data
    profiles:
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s


volumes:
  postgres_data:
  redis_data:
  minio_data:
