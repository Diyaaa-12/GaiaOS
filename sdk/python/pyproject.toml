[build-system]
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "gaiaos-sdk"
version = "1.0.0"
description = "Official Python SDK for GaiaOS — Agentic Planetary Risk Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "GaiaOS Core Engineering Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "httpx-sse>=0.4.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/Diyaaa-12/GaiaOS"
Repository = "https://github.com/Diyaaa-12/GaiaOS"

[tool.hatch.build.targets.wheel]
packages = ["gaiaos_sdk"]

[tool.hatch.build.targets.wheel.package-data]
gaiaos_sdk = ["py.typed"]
